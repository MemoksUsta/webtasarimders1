<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

            <table border="1" align="content">
                <caption>Veriler</caption>
                    <tr>
                        <td><label for="kadi">KULLANICI ADI GİRİNİZ:</LAbel></td>
                        <td>        <input  required type="text" name="kadi" id="kadi" placeholder="Kullanıcı Adı"></td>

                    </tr>
                    <br>
                    <tr>
                        <td>        <label for="sifre">Şifrenizi Giriniz&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label></td>
                        <td>        <input required type="password" name="sifre" id="sifre"></td>

                    </tr>
                    <br>
                    <tr>
                        <td>        <label for="emailadres">Email Adres&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label></td>
                        <td>        <input required type="email" name="emailadres" id="emailadres" value="a@a.com" readonly></td>

                    </tr>
                    <br>
                    <tr>
                        <td>         <label for="yas">YaşınızıGiriniz &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label></td>
                        <td>         <input type="number" min:10 max:25 name="yas" id="yas"></td>

                    </tr>
                    <tr>
                        <td>         <label for="dt">Doğum Tarihi</label></td>
                        <td>         <input required type="date" name="dt" id="dt"</td>

                    </tr>
                    <tr>
                        <td>         <label for="cinsiyet">Cinsiyetinizi Seçiniz</label></td>
                        <td> <input type="radio" name="cinsiyet" id="Erkek" value="E">Erkek          <input type="radio" name="cinsiyet" id="Kadın" value="K">Kadın</td>
                        
                    </tr>
                
                    <tr>
                        <td>         <label for="diller">Bildiğiniz Diller</label></td>
                        <td>
                            <input type="checkbox" name="diller" id="diller" value="c#">C#
                            <input type="checkbox" name="diller" id="diller" value="js">js
                        </td>

                    </tr>

                    <tr>

                        <td>        <label for="sinif">Sınıfınız</label></td>
                        <td>
                            <select name="sinif" id="sinif">
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>

                            </select>
                        </td>

                    </tr>
                    
                    
                    
            </table>
        </form>
    <br><br>
    <button type="submit">Gönder</button>  <br>
        <input type="reset" value="Sıfırla">   
    
    
</body>
</html>
