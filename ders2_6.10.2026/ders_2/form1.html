<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="" method="get" align="center" >
          <label for="kadi">KULLANICI ADI GİRİNİZ:</LAbel>
        <input  required type="text" name="kadi" id="kadi" placeholder="Kullanıcı Adı">
        <br>
        <label for="sifre">Şifrenizi Giriniz&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
        <input required type="password" name="sifre" id="sifre">
        <br>
        <label for="emailadres">Email Adres&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
        <input required type="email" name="emailadres" id="emailadres" value="a@a.com" readonly>
        <br>
         <label for="yas">YaşınızıGiriniz &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
         <input type="number" min:10 max:25 name="yas" id="yas">
        <br> 
         <label for="dt">Doğum Tarihi</label>
         <input required type="date" name="dt" id="dt">
         <br>
         <label for="cinsiyet">Cinsiyetinizi Seçiniz</label>
         <input type="radio" name="cinsiyet" id="Erkek" value="E">Erkek
         <input type="radio" name="cinsiyet" id="Kadın" value="K">Kadın

         <br>  
         <label for="diller">Bildiğiniz Diller</label>
         <input type="checkbox" name="diller" id="diller" value="c#">C#
         <input type="checkbox" name="diller" id="diller" value="js">js
        <br>
        <label for="sinif">Sınıfınız</label>
        <select name="sinif" id="sinif">
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>

        </select>
         
         <br><br>
        <button type="submit">Gönder</button>  <br>
        <input type="reset" value="Sıfırla">   
    </form>

</body>
</html>
